name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tool-unit-tests:
    name: Tool unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts

      - name: Run tool unit tests
        run: npm test
        working-directory: tool

  sample-app-tests:
    name: Sample-app integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts

      - name: Run sample-app integration tests
        run: npm test --workspace=sample-app
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/acme_test
        timeout-minutes: 5

  cli-smoke-test:
    name: CLI smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts

      - name: Verify --help exits 0
        run: node tool/cli.js --help

      - name: Verify scan subcommand runs against sample-app
        run: node tool/cli.js scan --path ./sample-app --json > /dev/null
