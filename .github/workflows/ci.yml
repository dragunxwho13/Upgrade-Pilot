name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tool-unit-tests:
    name: Tool unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts

      - name: Run tool unit tests
        run: npm test
        working-directory: tool

  sample-app-tests:
    name: Sample-app integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # report each Node version independently
      matrix:
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package-lock.json   # root lock file owns all workspaces

      # Cache the MongoDB binary that mongodb-memory-server downloads at test time.
      # Key is OS + package version so the binary is reused across runs.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-mms-8.16.0

      # Install everything from the root using the committed lock file.
      # --ignore-scripts prevents the postinstall binary-download from running at
      # install time (it happens on-demand during beforeAll instead, using the cache
      # path set by MONGOMS_PREFER_GLOBAL_PATH).
      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: Run sample-app integration tests
        run: npm test --workspace=sample-app -- --forceExit
        env:
          # Tell MMS to store/find the binary in the cached directory
          MONGOMS_PREFER_GLOBAL_PATH: "1"
        timeout-minutes: 5

  cli-smoke-test:
    name: CLI smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (root)
        run: npm ci --ignore-scripts

      - name: Verify --help exits 0
        run: node tool/cli.js --help

      - name: Verify scan subcommand runs against sample-app
        run: node tool/cli.js scan --path ./sample-app --json > /dev/null
